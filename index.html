<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundary Mart | Login Page</title>
    <link rel="stylesheet" href="index.css">
    
</head>
<body>
    <main class="container">
        <section class="left-section">
            <img src="washing.png"alt="Laundry Mart image" class="image" >
        </section>
        <section class="right-section">
            <h1>Hello Again!</h1>
            <p class="upertext">Welcome back We are glad to have you here!</p>
            <form action="#" method="post">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <br><a class="forgot-password" href="forgot-password.html">Forgot Password?</a>
                <br>
                <button type="submit">Login</button>
                <p class="membertext">Not a member yet? <a href="signup.html">Register Now</a></p>
            </form>
        </section>
    </main>
</body>
</html>
